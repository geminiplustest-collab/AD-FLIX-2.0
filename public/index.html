<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#020617"/>
<title>ADFLIX 2.0 — JIYYAD TOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#020617;--panel:#0b1224;--card:#111827;--line:#1e293b;
  --text:#f1f5f9;--muted:#94a3b8;--blue:#38bdf8;--blue2:#0ea5e9;--blue3:#0284c7;
  --accent:#22d3ee;--ok:#34d399;--warn:#fbbf24;
  --font:Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.4,.64,1);
  --safe:env(safe-area-inset-bottom,0px);
  --nav:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*:focus{outline:none}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.88)}100%{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.92)}}
@keyframes introLogo{0%{opacity:0;transform:scale(.6) translateY(12px);filter:blur(8px)}60%{opacity:1;transform:scale(1.04);filter:blur(0)}100%{opacity:1;transform:scale(1)}}
@keyframes introText{from{opacity:0;letter-spacing:.4em}to{opacity:1;letter-spacing:.12em}}
@keyframes introBar{from{width:0;opacity:0}to{width:120px;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* INTRO */
.intro{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .7s var(--ease),visibility .7s}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{text-align:center;padding:24px}
.intro-glow{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.35),transparent 70%);filter:blur(20px);animation:pulse 2.4s ease-in-out infinite}
.intro-logo{position:relative;width:92px;height:92px;margin:0 auto 18px;border-radius:22px;overflow:hidden;border:1px solid rgba(56,189,248,.35);background:#0b1224;animation:introLogo 1.1s var(--ease) forwards;box-shadow:0 0 40px rgba(14,165,233,.25)}
.intro-logo img{width:100%;height:100%;object-fit:contain}
.intro-logo .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:var(--blue)}
.intro-name{font-size:22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:0;animation:introText .9s var(--ease) .35s forwards}
.intro-name span{color:var(--blue)}
.intro-tag{margin-top:8px;font-size:12px;color:var(--muted);opacity:0;animation:fadeUp .6s var(--ease) .55s forwards}
.intro-bar{height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--blue),transparent);animation:introBar .8s var(--ease) .7s forwards}
.intro-dots{margin-top:16px;display:flex;gap:6px;justify-content:center;opacity:0;animation:fadeUp .5s var(--ease) .85s forwards}
.intro-dots i{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1s ease infinite}
.intro-dots i:nth-child(2){animation-delay:.15s}
.intro-dots i:nth-child(3){animation-delay:.3s}

.app{opacity:0;transition:opacity .5s;min-height:100vh;padding-bottom:calc(72px + var(--safe))}
.app.show{opacity:1}

/* TOP */
.top{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px 14px;background:linear-gradient(180deg,rgba(2,6,23,.96),rgba(2,6,23,.82));
  backdrop-filter:blur(12px);border-bottom:1px solid transparent;
}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.brand-mark{width:36px;height:36px;border-radius:10px;background:#0b1224;border:1px solid rgba(56,189,248,.3);overflow:hidden;display:flex;align-items:center;justify-content:center}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.3px}
.brand h1 span{color:var(--blue)}
.brand p{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.search-wrap{flex:1;position:relative;max-width:420px;margin-left:auto}
.search-wrap input{
  width:100%;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  padding:0 40px 0 14px;font-size:13.5px;font-weight:600;color:var(--text);
}
.search-wrap input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.search-wrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}

/* HERO */
.hero{position:relative;min-height:48vh;max-height:560px;display:flex;align-items:flex-end;overflow:hidden;animation:fadeIn .6s var(--ease)}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.55}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,23,.2) 0%,rgba(2,6,23,.55) 45%,var(--bg) 100%),linear-gradient(90deg,rgba(2,6,23,.85) 0%,rgba(2,6,23,.35) 55%,transparent 100%)}
.hero-body{position:relative;z-index:1;padding:24px 16px 28px;max-width:640px;animation:fadeUp .6s var(--ease) .1s both}
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.hero h2{font-size:clamp(24px,5vw,40px);font-weight:800;letter-spacing:-.8px;line-height:1.1;margin-bottom:8px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:12.5px;font-weight:650;color:var(--muted)}
.hero-meta .rate{color:var(--ok)}
.hero p{font-size:13.5px;line-height:1.5;color:#cbd5e1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  height:42px;padding:0 16px;border-radius:10px;border:none;font-weight:750;font-size:13.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  transition:transform .15s var(--bounce),opacity .2s,background .2s;
}
.btn:active{transform:scale(.97)}
.btn-play{background:var(--blue2);color:#04111c}
.btn-play:hover{background:var(--blue)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}
.btn svg{width:16px;height:16px}

/* ROWS */
.section{padding:8px 0 4px;animation:fadeUp .5s var(--ease) both}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.section-head h3{font-size:16px;font-weight:800}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 16px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.poster{
  flex:0 0 auto;width:118px;scroll-snap-align:start;cursor:pointer;
  animation:popIn .45s var(--bounce) both;transition:transform .2s var(--ease);
}
.poster:hover{transform:translateY(-4px) scale(1.03)}
.poster-img{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.poster-img img{width:100%;height:100%;object-fit:cover}
.poster-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);background:linear-gradient(135deg,#0b1224,#1e293b)}
.poster-title{margin-top:6px;font-size:12px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
@media(min-width:768px){
  .poster{width:150px}
  .hero{min-height:62vh}
  .hero-body{padding:40px 32px 48px}
  .section-head,.row{padding-left:32px;padding-right:32px}
  .top{padding-left:32px;padding-right:32px}
}

/* SEARCH RESULTS */
.panel{padding:16px;display:none}
.panel.on{display:block;animation:fadeUp .4s var(--ease)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:0 16px}}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-weight:600}

/* DETAIL / WATCH overlay */
.overlay{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;overflow:auto}
.overlay.on{display:flex;animation:fadeIn .3s var(--ease)}
.ov-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(2,6,23,.95);backdrop-filter:blur(10px);z-index:2}
.ov-top button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ov-top button svg{width:18px;height:18px}
.ov-top h3{font-size:14px;font-weight:750;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.player-wrap{background:#000;aspect-ratio:16/9;width:100%;max-height:56vh;position:relative}
.player-wrap iframe{width:100%;height:100%;border:0;display:block}
.player-wrap .pl-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);background:#000}
.servers{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.servers::-webkit-scrollbar{display:none}
.srv{
  flex:0 0 auto;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;transition:.2s;
}
.srv.on{background:rgba(14,165,233,.15);border-color:var(--blue2);color:var(--blue)}
.srv .tag{font-size:9px;padding:2px 5px;border-radius:4px;background:rgba(251,191,36,.15);color:var(--warn);font-weight:800}
.srv .tag.clean{background:rgba(52,211,153,.12);color:var(--ok)}
.detail-body{padding:14px 16px 28px}
.detail-body h2{font-size:20px;font-weight:800;margin-bottom:6px}
.detail-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);font-weight:650;margin-bottom:10px}
.detail-body .ov{font-size:13.5px;line-height:1.55;color:#cbd5e1;margin-bottom:14px}
.cast{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.cast::-webkit-scrollbar{display:none}
.cast-item{flex:0 0 auto;width:72px;text-align:center}
.cast-item img{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto 4px;border:1px solid var(--line);background:var(--card)}
.cast-item span{font-size:10.5px;font-weight:650;color:var(--muted);display:block;line-height:1.2}

.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--muted)}
.spin{width:22px;height:22px;border:2.5px solid rgba(56,189,248,.2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:space-around;padding:8px 8px calc(8px + var(--safe));
  background:rgba(2,6,23,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);
}
.bottom-nav button{
  flex:1;background:none;border:none;color:var(--muted);font-size:10px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer;
}
.bottom-nav button.on{color:var(--blue)}
.bottom-nav svg{width:20px;height:20px}
@media(min-width:900px){
  .bottom-nav{display:none}
  .app{padding-bottom:24px}
  .player-wrap{max-height:70vh}
}

.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe));transform:translateX(-50%) translateY(8px);background:#fff;color:#020617;padding:10px 14px;border-radius:999px;font-size:12.5px;font-weight:750;opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{background:linear-gradient(90deg,#0b1224 25%,#1e293b 50%,#0b1224 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:10px}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="intro-glow"></div>
  <div class="intro-inner">
    <div class="intro-logo">
      <img src="logo-jiyyad.png" alt="JT" onerror="this.remove();this.parentElement.innerHTML='<div class=fallback>AD</div>'"/>
    </div>
    <div class="intro-name">AD<span>FLIX</span> 2.0</div>
    <div class="intro-tag">JIYYAD TOOLS · membuat website kebutuhan anda</div>
    <div class="intro-bar"></div>
    <div class="intro-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand" id="goHome">
      <div class="brand-mark"><img src="logo-jiyyad.png" alt="" onerror="this.parentElement.textContent='AD'"/></div>
      <div>
        <h1>AD<span>FLIX</span></h1>
        <p>Jiyyad Tools</p>
      </div>
    </div>
    <div class="search-wrap">
      <input id="q" type="search" placeholder="Cari film / series..." autocomplete="off"/>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
  </header>

  <div id="homeView">
    <section class="hero" id="hero">
      <div class="hero-bg"><img id="heroImg" alt=""/></div>
      <div class="hero-body">
        <div class="hero-badge">✦ Featured</div>
        <h2 id="heroTitle">Memuat…</h2>
        <div class="hero-meta" id="heroMeta"></div>
        <p id="heroOv"></p>
        <div class="hero-actions">
          <button class="btn btn-play" id="heroPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Putar</button>
          <button class="btn btn-ghost" id="heroInfo">Detail</button>
        </div>
      </div>
    </section>
    <section class="section" style="animation-delay:.08s">
      <div class="section-head"><h3>Film Trending</h3></div>
      <div class="row" id="rowMovies"><div class="loading"><div class="spin"></div></div></div>
    </section>
    <section class="section" style="animation-delay:.14s">
      <div class="section-head"><h3>Series Trending</h3></div>
      <div class="row" id="rowSeries"><div class="loading"><div class="spin"></div></div></div>
    </section>
  </div>

  <div class="panel" id="searchView">
    <div class="section-head"><h3 id="searchLabel">Hasil pencarian</h3></div>
    <div class="grid" id="searchGrid"></div>
    <div class="empty" id="searchEmpty" style="display:none">Tidak ada hasil</div>
  </div>
</div>

<div class="overlay" id="watch">
  <div class="ov-top">
    <button type="button" id="closeWatch" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h3 id="watchTitle">—</h3>
  </div>
  <div class="player-wrap" id="player">
    <div class="pl-ph"><div class="spin"></div><div>Memuat player…</div></div>
  </div>
  <div class="servers" id="servers"></div>
  <div class="detail-body">
    <h2 id="dTitle">—</h2>
    <div class="detail-meta" id="dMeta"></div>
    <p class="ov" id="dOv"></p>
    <div style="font-size:12px;font-weight:800;margin-bottom:8px;color:var(--muted)">CAST</div>
    <div class="cast" id="dCast"></div>
    <div style="font-size:12px;font-weight:800;margin:16px 0 8px;color:var(--muted)">MIRIP</div>
    <div class="row" id="dRec" style="padding-left:0"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button type="button" class="on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>Beranda</button>
  <button type="button" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Cari</button>
  <button type="button" data-tab="movies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 5v14M17 5v14"/></svg>Film</button>
  <button type="button" data-tab="series"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg>Series</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let home = {movies:[], series:[]};
let featured = null;
let current = null;
let servers = [];
let searchTimer = null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove('on'),2000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function posterCard(item, delay=0){
  if(!item||!item.id) return '';
  const img = item.posterUrl || '';
  return `<div class="poster" style="animation-delay:${delay}s" data-id="${item.id}" data-type="${esc(item.mediaType||'movie')}">
    <div class="poster-img">${img?`<img src="${esc(img)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=ph>No Poster</div>'"/>`:'<div class="ph">No Poster</div>'}</div>
    <div class="poster-title">${esc(item.title)}</div>
    <div class="poster-sub">${esc([item.year, item.rating!=null?Number(item.rating).toFixed(1):''].filter(Boolean).join(' · '))}</div>
  </div>`;
}
function bindPosters(root){
  root.querySelectorAll('.poster').forEach(el=>{
    el.onclick = ()=> openWatch(el.dataset.type, el.dataset.id);
  });
}

async function loadHome(){
  try{
    const r = await fetch('/api/home');
    const d = await r.json();
    home.movies = d.movies||[];
    home.series = d.series||[];
    featured = home.movies[0] || home.series[0] || null;
    renderHero();
    $('#rowMovies').innerHTML = home.movies.slice(0,18).map((x,i)=>posterCard(x,i*0.03)).join('') || '<div class="empty">Kosong</div>';
    $('#rowSeries').innerHTML = home.series.slice(0,18).map((x,i)=>posterCard(x,i*0.03)).join('') || '<div class="empty">Kosong</div>';
    bindPosters($('#rowMovies'));
    bindPosters($('#rowSeries'));
  }catch(e){
    $('#rowMovies').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}
function renderHero(){
  if(!featured) return;
  $('#heroImg').src = featured.backdropUrl || featured.posterUrl || '';
  $('#heroTitle').textContent = featured.title || '—';
  $('#heroMeta').innerHTML = [
    featured.year?`<span>${esc(featured.year)}</span>`:'',
    featured.rating!=null?`<span class="rate">★ ${Number(featured.rating).toFixed(1)}</span>`:'',
    `<span>${esc((featured.mediaType||'movie').toUpperCase())}</span>`
  ].join('');
  $('#heroOv').textContent = featured.overview || '';
  $('#heroPlay').onclick = ()=> openWatch(featured.mediaType||'movie', featured.id);
  $('#heroInfo').onclick = ()=> openWatch(featured.mediaType||'movie', featured.id);
}

async function openWatch(type, id){
  current = {type, id};
  $('#watch').classList.add('on');
  $('#watchTitle').textContent = 'Memuat…';
  $('#dTitle').textContent = '…';
  $('#dMeta').innerHTML = '';
  $('#dOv').textContent = '';
  $('#dCast').innerHTML = '';
  $('#dRec').innerHTML = '';
  $('#player').innerHTML = '<div class="pl-ph"><div class="spin"></div><div>Memuat player…</div></div>';
  $('#servers').innerHTML = '';
  try{
    const [td, wd] = await Promise.all([
      fetch(`/api/title/${type}/${id}`).then(r=>r.json()),
      fetch(`/api/watch/${type}/${id}`).then(r=>r.json()),
    ]);
    const d = td.detail || {};
    servers = wd.servers || [];
    $('#watchTitle').textContent = d.title || 'ADFLIX';
    $('#dTitle').textContent = d.title || '—';
    $('#dMeta').innerHTML = [
      d.year?`<span>${esc(d.year)}</span>`:'',
      d.rating!=null?`<span style="color:var(--ok)">★ ${Number(d.rating).toFixed(1)}</span>`:'',
      Array.isArray(d.genres)?d.genres.slice(0,3).map(g=>`<span>${esc(typeof g==='string'?g:g.name||g)}</span>`).join(''):''
    ].join('');
    $('#dOv').textContent = d.overview || 'Tidak ada sinopsis.';
    $('#dCast').innerHTML = (d.cast||[]).map(c=>`
      <div class="cast-item">
        ${c.profileUrl?`<img src="${esc(c.profileUrl)}" alt="" loading="lazy"/>`:'<img alt=""/>'}
        <span>${esc(c.name||'')}</span>
      </div>`).join('') || '<span style="color:var(--muted);font-size:12px">—</span>';
    $('#dRec').innerHTML = (d.recommendations||[]).map((x,i)=>posterCard(x,i*0.03)).join('');
    bindPosters($('#dRec'));
    renderServers(0);
  }catch(e){
    toast(e.message||'Gagal muat');
  }
}
function renderServers(active=0){
  $('#servers').innerHTML = servers.map((s,i)=>`
    <button type="button" class="srv ${i===active?'on':''}" data-i="${i}">
      ${esc(s.name)} · ${esc(s.label)}
      <span class="tag ${s.ads?'':'clean'}">${s.ads?'ADS':'CLEAN'}</span>
    </button>`).join('');
  $('#servers').querySelectorAll('.srv').forEach(btn=>{
    btn.onclick = ()=>{
      const i = +btn.dataset.i;
      renderServers(i);
    };
  });
  const s = servers[active];
  if(s && s.url){
    $('#player').innerHTML = `<iframe src="${esc(s.url)}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>`;
  } else {
    $('#player').innerHTML = '<div class="pl-ph">Server tidak tersedia</div>';
  }
}

$('#closeWatch').onclick = ()=>{
  $('#watch').classList.remove('on');
  $('#player').innerHTML = '';
};
$('#goHome').onclick = ()=> showTab('home');

function showTab(tab){
  $$('.bottom-nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  if(tab==='home'){
    $('#homeView').style.display='block';
    $('#searchView').classList.remove('on');
  } else if(tab==='search'){
    $('#homeView').style.display='none';
    $('#searchView').classList.add('on');
    $('#q').focus();
  } else if(tab==='movies'){
    $('#homeView').style.display='none';
    $('#searchView').classList.add('on');
    $('#searchLabel').textContent = 'Film Trending';
    $('#searchGrid').innerHTML = home.movies.map((x,i)=>posterCard(x,i*0.02)).join('');
    bindPosters($('#searchGrid'));
    $('#searchEmpty').style.display = home.movies.length?'none':'block';
  } else if(tab==='series'){
    $('#homeView').style.display='none';
    $('#searchView').classList.add('on');
    $('#searchLabel').textContent = 'Series Trending';
    $('#searchGrid').innerHTML = home.series.map((x,i)=>posterCard(x,i*0.02)).join('');
    bindPosters($('#searchGrid'));
    $('#searchEmpty').style.display = home.series.length?'none':'block';
  }
}
$$('.bottom-nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

$('#q').addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const q = $('#q').value.trim();
  if(!q){ showTab('home'); return; }
  searchTimer = setTimeout(async ()=>{
    showTab('search');
    $('#searchLabel').textContent = `Hasil: “${q}”`;
    $('#searchGrid').innerHTML = '<div class="loading"><div class="spin"></div></div>';
    try{
      const r = await fetch('/api/search?q='+encodeURIComponent(q));
      const d = await r.json();
      const list = d.results||[];
      $('#searchGrid').innerHTML = list.map((x,i)=>posterCard(x,i*0.02)).join('');
      bindPosters($('#searchGrid'));
      $('#searchEmpty').style.display = list.length?'none':'block';
    }catch(e){
      $('#searchGrid').innerHTML = '';
      $('#searchEmpty').style.display = 'block';
      $('#searchEmpty').textContent = e.message;
    }
  }, 350);
});

window.addEventListener('scroll', ()=>{
  $('#top').classList.toggle('scrolled', scrollY>20);
}, {passive:true});

setTimeout(()=>{
  $('#intro').classList.add('hide');
  $('#app').classList.add('show');
  setTimeout(()=>{$('#intro').style.display='none'}, 750);
  loadHome();
}, 2600);
</script>
</body>
</html>
